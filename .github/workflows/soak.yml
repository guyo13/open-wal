name: Soak (M9)

# §14.10 soak / endurance test (`tests/soak.rs`, driven by `scripts/m9/soak.sh`).
# NIGHTLY/manual tier (§14.11): a sustained randomized append/commit/checkpoint/
# crash-recover workload against one long-lived WAL, watching fd count, segment-dir
# disk usage, RSS, and commit-latency tails, plus the §14.3 oracle on every recover.
#
# HONEST FRAMING (same stopgap as LazyFS / dm-flakey / bench): the per-PR lane does
# NOT run this — it is too slow and the long gate needs hours. The §14.13 soak gate
# is a MULTI-HOUR run with zero resource regression and zero oracle violation; a
# hosted nightly slice (default 300s here) is a CONTINGENT smoke that proves the
# driver/monitors work, NOT the gate. To accumulate real gate evidence, DISPATCH
# with a larger `seconds` AND set `runner: fuzz-rig` so it runs on the dedicated
# self-hosted box (a hosted runner is time-limited and cannot hold a multi-hour
# run). A failure here (resource leak or invariant breach) is a real bug and reds
# the run. The evidence artifact is uploaded each run.
on:
  schedule:
    # 05:17 UTC daily — offset from the fuzz (04:17) and bench (03:17) jobs.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Soak duration in wall-clock seconds (multi-hour = the real gate, e.g. 21600)"
        required: false
        default: "300"
      seed:
        description: "LCG seed (decimal; blank = the test's fixed default)"
        required: false
        default: ""
      runner:
        description: "Where to run: 'hosted' (nightly smoke) or 'fuzz-rig' (self-hosted, for the multi-hour gate)"
        required: false
        default: "hosted"
        type: choice
        options:
          - hosted
          - fuzz-rig

concurrency:
  group: soak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: soak / endurance (contingent until multi-hour)
    # Scheduled runs and 'hosted' dispatch → ubuntu-latest; 'fuzz-rig' dispatch →
    # the dedicated self-hosted box (needed to hold a multi-hour run).
    runs-on: ${{ (github.event.inputs.runner == 'fuzz-rig') && fromJSON('["self-hosted","fuzz-rig"]') || 'ubuntu-latest' }}
    # 6 h ceiling covers a real multi-hour gate run; the hosted smoke finishes in minutes.
    timeout-minutes: 375
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run soak
        env:
          WAL_M9_EVIDENCE: soak-evidence.json
        run: |
          SECS="${{ github.event.inputs.seconds || '300' }}"
          SEED="${{ github.event.inputs.seed || '' }}"
          RUNNER="${{ github.event.inputs.runner || 'hosted' }}"
          echo "::notice::Soak for ${SECS}s (seed='${SEED:-default}') on '${RUNNER}'."
          if [ "$RUNNER" = "fuzz-rig" ] && [ "${SECS}" -ge 3600 ]; then
            echo "::notice::Multi-hour run on the dedicated box — this accrues toward the §14.13 soak gate."
          else
            echo "::warning::CONTINGENT smoke, NOT the §14.13 multi-hour soak gate. Green here does not satisfy the gate; a failure is a real bug."
          fi
          scripts/m9/soak.sh "${SECS}" "${SEED}"

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ github.run_id }}
          path: soak-evidence.json
          retention-days: 90
          if-no-files-found: warn
